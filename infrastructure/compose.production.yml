# VEXA public-server deployment. Do NOT combine this with docker-compose.yml:
# local dev publishes cleartext service ports; production exposes only Caddy 80/443.
name: vexa-production
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - vexa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: &logconfig
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    restart: unless-stopped
    networks: [private]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    volumes:
      - vexa_redisdata:/data
    logging: *logconfig
    restart: unless-stopped
    networks: [private]

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: vexa-backend:${VEXA_IMAGE_TAG:-0.3.42-vps}
    command: ["alembic", "upgrade", "head"]
    environment: &api-env
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      DEFAULT_CITY_ID: ${DEFAULT_CITY_ID:-obolensk}
      REDIS_URL: redis://redis:6379/0
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-osrm}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-}
      LEGAL_DISPATCH_ENFORCEMENT: "true"
      DISPATCH_SEARCH_TIMEOUT_SECONDS: ${DISPATCH_SEARCH_TIMEOUT_SECONDS:-180}
      DISPATCH_POLL_INTERVAL_SECONDS: ${DISPATCH_POLL_INTERVAL_SECONDS:-2}
      DISPATCH_BATCH_SIZE: ${DISPATCH_BATCH_SIZE:-100}
      SMS_AUTH_PRIMARY_PROVIDER: ${SMS_AUTH_PRIMARY_PROVIDER:-sms_aero}
      SMS_AERO_EMAIL: ${SMS_AERO_EMAIL:-}
      SMS_AERO_API_KEY: ${SMS_AERO_API_KEY:-}
      SMS_AERO_SIGN: ${SMS_AERO_SIGN:-SMS Aero}
      SMSGOLD_USER: ${SMSGOLD_USER:-}
      SMSGOLD_PASS: ${SMSGOLD_PASS:-}
      SMS_AUTH_CALLBACK_SECRET: ${SMS_AUTH_CALLBACK_SECRET:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      PUBLIC_API_BASE_URL: https://${VEXA_DOMAIN:-45.143.139.162}
    depends_on:
      db:
        condition: service_healthy
    logging: *logconfig
    restart: "no"
    networks: [private]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: vexa-backend:${VEXA_IMAGE_TAG:-0.3.42-vps}
    environment: *api-env
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    logging: *logconfig
    restart: unless-stopped
    networks: [private]

  vexa_map:
    build:
      context: ../VEXA_MAP
      dockerfile: Dockerfile
    image: vexa-map:${VEXA_IMAGE_TAG:-0.3.42-vps}
    environment:
      VEXA_MAP_HOST: 0.0.0.0
      VEXA_MAP_PORT: "8090"
      VEXA_MAP_MBTILES: /data/regions
      VEXA_MAP_PLACES: /data/places.sqlite
      VEXA_MAP_OSRM_URL: ${VEXA_MAP_OSRM_URL:-}
      VEXA_MAP_TRUST_PROXY: "1"
      VEXA_MAP_PUBLIC_BASE: https://${VEXA_DOMAIN:-45.143.139.162}/maps
      VEXA_MAP_SERVE_OFFLINE_PACKS: ${VEXA_MAP_SERVE_OFFLINE_PACKS:-0}
    volumes:
      - ../VEXA_MAP/data:/data:ro
    expose: ["8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *logconfig
    restart: unless-stopped
    networks: [private]

  osrm:
    profiles: ["routing"]
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: ["osrm-routed", "--algorithm", "mld", "/data/region.osrm"]
    volumes:
      - ../VEXA_MAP/data/osrm:/data:ro
    expose: ["5000"]
    logging: *logconfig
    restart: unless-stopped
    networks: [private]

  dispatch_worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: vexa-backend:${VEXA_IMAGE_TAG:-0.3.42-vps}
    command: ["python", "-m", "app.dispatch_worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; from pathlib import Path; assert time.time()-Path('/tmp/vexa-dispatch-worker.heartbeat').stat().st_mtime < max(90, float(os.getenv('DISPATCH_POLL_INTERVAL_SECONDS','2'))*4)"]
      interval: 15s
      timeout: 5s
      retries: 6
    init: true
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    logging: *logconfig
    restart: unless-stopped
    networks: [private]

  dispatcher:
    build:
      context: ../dispatcher
      dockerfile: Dockerfile
    image: vexa-dispatcher:${VEXA_IMAGE_TAG:-0.3.42-vps}
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api: {condition: service_healthy}
    logging: *logconfig
    restart: unless-stopped
    networks: [private]

  platform_admin:
    build:
      context: ../platform-admin
      dockerfile: Dockerfile
    image: vexa-platform-admin:${VEXA_IMAGE_TAG:-0.3.42-vps}
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api: {condition: service_healthy}
    logging: *logconfig
    restart: unless-stopped
    networks: [private]

  gateway:
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      VEXA_DOMAIN: ${VEXA_DOMAIN:-45.143.139.162}
    volumes:
      - ${VEXA_CADDY_FILE:-./Caddyfile.production}:/etc/caddy/Caddyfile:ro
      - vexa_caddy_data:/data
      - vexa_caddy_config:/config
    depends_on:
      - dispatcher
      - platform_admin
      - vexa_map
    logging: *logconfig
    restart: unless-stopped
    networks: [private]

networks:
  private:
    driver: bridge
volumes:
  vexa_pgdata:
  vexa_redisdata:
  vexa_caddy_data:
  vexa_caddy_config:
